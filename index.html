<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Cerramientos de Obra y Áreas Liberadas - Línea 2</title>
 <!-- Leaflet CSS -->
 <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
 <link rel="stylesheet" href="style.css">
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

 <!-- Contenedor del Mapa (Debe ir primero para que Leaflet calcule bien el DOM) -->
 <div id="map"></div>

 <!-- Cabecera Superior: Título y Filtro por Estado -->
 <div id="header-container">
   <div id="titulo-flotante">Cerramientos de Obra y Áreas Liberadas - Línea 2</div>
   
   <!-- Panel de Filtro por Estado (Colapsable en Móvil) -->
   <div id="panel-filtros">
     <div class="filtro-header-mobile" onclick="toggleFiltros()">
       <span>🔍 FILTRAR POR ESTADO</span>
       <span id="filtro-icon">▼</span>
     </div>
     <div class="filtros-contenido" id="filtrosContenido">
       <div class="filtro-titulo-web">FILTRO POR ESTADO</div>
       <div class="filtros-botones">
         <button class="filtro-btn btn-todos active" onclick="filtrarEstado('todos')">Todos</button>
         <button class="filtro-btn btn-inicial" onclick="filtrarEstado('inicial')">Cerramiento Inicial</button>
         <button class="filtro-btn btn-residual" onclick="filtrarEstado('residual')">Área Residual</button>
         <button class="filtro-btn btn-liberado" onclick="filtrarEstado('liberado')">Área Liberada</button>
         <button class="filtro-btn btn-culminada" onclick="filtrarEstado('culminada')">Obra Culminada</button>
         <button class="filtro-btn btn-temporal" onclick="filtrarEstado('30dias')">&lt; 30 Días</button>
       </div>
     </div>
   </div>
 </div>

 <!-- Panel de Indicadores de Gestión (KPIs) -->
 <div id="panel-kpis">
   <div class="kpi-card kpi-inicial">
     <span class="kpi-title">Cerco Inicial</span>
     <span class="kpi-value" id="kpi-inicial">0</span>
   </div>
   <div class="kpi-card kpi-residual">
     <span class="kpi-title">Área Residual</span>
     <span class="kpi-value" id="kpi-residual">0</span>
   </div>
   <div class="kpi-card kpi-liberado">
     <span class="kpi-title">Área Liberada</span>
     <span class="kpi-value" id="kpi-liberado">0</span>
   </div>
   <div class="kpi-card kpi-culminada">
     <span class="kpi-title">Culminadas</span>
     <span class="kpi-value" id="kpi-culminada">0</span>
   </div>
 </div>

 <!-- Leyenda de Cerramientos -->
 <div id="panel-leyenda">
   <span class="leyenda-titulo">LEYENDA DE CERRAMIENTOS</span>
   <div class="leyenda-item">
     <span class="leyenda-color color-inicial"></span> Mantiene Cerramiento (Inicial)
   </div>
   <div class="leyenda-item">
     <span class="leyenda-color color-residual"></span> Área Residual
   </div>
   <div class="leyenda-item">
     <span class="leyenda-color color-liberado"></span> Área Liberada
   </div>
   <div class="leyenda-item">
     <span class="leyenda-color color-culminada"></span> Obra Culminada
   </div>
 </div>

 <!-- Botones de Acciones (Consultor IA y Reportes) -->
 <div id="panel-acciones">
   <button class="btn-accion btn-consultor" onclick="abrirConsultorIA()" title="Consultor IA">
     🤖 Consultar Datos
   </button>
   <button class="btn-accion btn-reporte" onclick="generarReporteTXT()" title="Reporte TXT">
     📄 Reporte
   </button>
 </div>

 <!-- Marca de Agua Discreta -->
 <div id="marca-agua">Diseñado por Vladimir Casas</div>

 <!-- Librerías JS y Script -->
 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
 <script src="script.js"></script>
</body>
</html>
