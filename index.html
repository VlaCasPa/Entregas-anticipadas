<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerramientos de Obra y Áreas Liberadas - Línea 2</title>
    <!-- CSS de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <!-- Tu archivo de estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Título Principal -->
    <div id="titulo-flotante">Cerramientos de Obra y Áreas Liberadas - Línea 2 y Ramal 4</div>

    <!-- Panel de Indicadores de Gestión (KPIs) -->
    <div id="panel-kpis">
        <div class="kpi-box">
            <span class="kpi-title">ESTACIONES</span>
            <span class="kpi-value" id="kpi-estaciones">0</span>
        </div>
        <div class="kpi-box">
            <span class="kpi-title">POZOS</span>
            <span class="kpi-value" id="kpi-pozos">0</span>
        </div>
        <div class="kpi-box">
            <span class="kpi-title">OTROS (Patios/Túnel)</span>
            <span class="kpi-value" id="kpi-otros">0</span>
        </div>
    </div>

    <!-- Contenedor del Mapa -->
    <div id="map"></div>

    <!-- Librerías JS y Script -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <!-- Tu archivo de lógica -->
    <script src="script.js"></script>
</body>
</html>
