<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Autorizaciones - Línea 2 Metro</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="style.css">
    <!-- Tipografía Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Título Flotante Superior -->
    <div id="titulo-flotante">Permisos de Obra - Línea 2 y Ramal L4</div>

    <!-- Panel de KPIs Ejecutivos (5 Tarjetas) -->
    <div id="panel-kpis">
        <div class="kpi-card kpi-critico">
            <span class="kpi-title">Críticos</span>
            <span class="kpi-value" id="kpi-rojo">0</span>
        </div>
        <div class="kpi-card kpi-por-vencer">
            <span class="kpi-title">&lt; 4 Meses</span>
            <span class="kpi-value" id="kpi-amarillo">0</span>
        </div>
        <div class="kpi-card kpi-ley">
            <span class="kpi-title">Ley 31955</span>
            <span class="kpi-value" id="kpi-naranja">0</span>
        </div>
        <div class="kpi-card kpi-tramite">
            <span class="kpi-title">En Trámite</span>
            <span class="kpi-value" id="kpi-morado">0</span>
        </div>
        <div class="kpi-card kpi-culminado">
            <span class="kpi-title">Culminadas</span>
            <span class="kpi-value" id="kpi-verde">0</span>
        </div>
    </div>

    <!-- Panel de Filtros y Leyenda -->
    <div id="panel-filtros">
        <div class="filtro-seccion">
            <span class="filtro-label">FILTRAR POR ESTRUCTURA</span>
            <div class="filtro-scroll" id="contenedor-filtros-id">
                <button class="btn-pill active" data-id="Todos">Todos</button>
            </div>
        </div>
        
        <div class="filtro-seccion">
            <span class="filtro-label">LEYENDA Y ESTADO</span>
            <div class="filtro-scroll">
                <button class="btn-pill active" data-estado="Todos">Mostrar Todos</button>
                <button class="btn-pill btn-critico" data-estado="Criticos">🔴 Críticas/Vencidas</button>
                <button class="btn-pill btn-meses" data-estado="Menor4Meses">🟡 &lt; 4 Meses</button>
                <button class="btn-pill btn-tramite" data-estado="Tramite">🟣 En Trámite</button>
                <button class="btn-pill btn-culminado" data-estado="Culminado">🟢 Culminadas</button>
                <button class="btn-pill btn-ley" data-estado="Ley31955">🟠 Ley N° 31955</button>
            </div>
        </div>
    </div>

    <!-- Contenedor del Mapa -->
    <div id="map"></div>
    
    <!-- Botón Flotante WhatsApp con Firma -->
    <button id="btn-whatsapp" class="btn-float" title="Copiar reporte resumen">
        <span class="btn-text-main">📋 Reporte WhatsApp</span>
        <span class="btn-text-sub">diseñado por Vladimir Casas</span>
    </button>

    <!-- Librerías JS y Script principal -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
